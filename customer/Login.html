                <div class="present present-large">

                    <div class="present-box">

                </div>

                <div class="flower-arrangement">
                    <div class="flower flower-one">

                    </div>

                    <div class="flower flower-two">
                        <div class="flower-head"></div>

                    </div>

                    <div class="flower flower-three">
                        <div class="flower-head"></div>

                        <div class="flower-leaf"></div>
                    </div>
                </div>


                <div class="present present-small">

                    <div class="present-box">
                        <div class="present-ribbon"></div>

                        <div class="present-lid">

                    </div>

                    <span class="present-star star-three">✦</span>

                    <span class="present-star star-four">✧</span>

            </div>

        </section>

        <main class="form-panel">

            <div class="login-content">

                <div class="top-label">WELCOME BACK</div>

                <h2>Sign in to Giftly</h2>

                <p class="description">
                    Welcome back! Please enter your details.
                </p>

                <form action="" method="POST">

                    <div class="form-group">

                        <label for="email">Email address</label>

                        <input type="email" id="email" name="email" placeholder="Enter your email" required>

                    </div>


                    <div class="form-group">

                        <div class="password-heading">

                            <label for="password">Password</label>

                            <a href="#">Forgot password?</a>

                        </div>

                        <input type="password" id="password" name="password" placeholder="Enter your password" required>

                    </div>


                    <label class="remember">

                        <input type="checkbox" name="remember">

                        <span>Remember me</span>

                    </label>


                    <button type="submit" class="login-button">
                        Sign in
                    </button>

                </form>


                <div class="register-text">

                    Don't have an account?

                    <a href="register.php">Create an account</a>

                </div>

            </div>


            <footer class="form-footer">
                © 2026 Giftly. All rights reserved.
            </footer>

        </main>
